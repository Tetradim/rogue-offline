<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="refresh" content="0; url=index.html">
  <style>
    body { margin: 0; background: #0f172a; color: #e2e8f0; font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
    .spinner { width: 50px; height: 50px; border: 4px solid #1e293b; border-top-color: #38bdf8; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }

    p { color: #94a3b8; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>Loading...</p>
  <p><a href="index.html">Click here if not redirected</a></p>
</body>
</html>
