name: Apply launcher path repair

on:
  push:
    branches:
      - fix/updating-launcher-tool-path
    paths:
      - 'Tool/scripts/patch-launcher-tool-path.mjs'
      - '.github/workflows/patch-launcher-tool-path.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/updating-launcher-tool-path
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch updating launcher
        run: node Tool/scripts/patch-launcher-tool-path.mjs

      - name: Commit launcher repair
        run: |
          if git diff --quiet -- Tool/Launch-Updating.bat; then
            echo 'Launcher was already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tool/Launch-Updating.bat
          git commit -m 'fix: resolve updater root from working directory'
          git push origin HEAD:fix/updating-launcher-tool-path
