name: Apply final Windows hardening fixes

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-hardening-fixes.yml
      - Tool/scripts/apply-final-hardening-fixes.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-hardening
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tool/package-lock.json

      - name: Apply exact regression fixes
        run: python Tool/scripts/apply-final-hardening-fixes.py

      - name: Remove one-time patch machinery
        shell: pwsh
        run: |
          Remove-Item Tool/scripts/apply-final-hardening-fixes.py
          Remove-Item .github/workflows/apply-final-hardening-fixes.yml

      - name: Install dependencies
        working-directory: Tool
        run: npm ci

      - name: Run complete test suite
        working-directory: Tool
        run: npm test

      - name: Build production UI
        working-directory: Tool
        run: npm run build

      - name: Check service syntax
        working-directory: Tool
        run: npm run check:service

      - name: Check installer syntax
        working-directory: Tool
        run: npm run check-installer

      - name: Validate final diff
        shell: pwsh
        run: git diff --check

      - name: Commit and push corrected branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: close final Windows hardening regressions"
          git push origin HEAD:fix/release-hardening
