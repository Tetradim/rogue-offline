name: Publish hardened Mod Studio

on:
  push:
    branches:
      - fix/release-hardening
    paths:
      - '.github/workflows/hardening-final-publish.yml'

permissions:
  contents: write

jobs:
  verify-and-publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/release-hardening
          fetch-depth: 0

      - name: Finalize release commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          Remove-Item -Force -ErrorAction SilentlyContinue `
            .github/workflows/hardening-final-publish.yml, `
            .github/workflows/hardening-followup-patch.yml, `
            .github/workflows/hardening-path-followup.yml
          $report = 'Tool/BUILD_REPORT.md'
          $evidence = @"

          ## Final publication gate

          Windows GitHub Actions run `$env:GITHUB_RUN_ID` validates the finalized hardening commit before it is pushed to `main`. The gate requires the full test suite, production build/postbuild, service and installer syntax, committed-range whitespace validation, and a production localhost smoke test. The commit is not published when any step fails.
          "@
          $text = Get-Content $report -Raw
          if ($text -notmatch '## Final publication gate') {
            Add-Content -Path $report -Value $evidence
          }
          git add -A
          git commit -m "chore: finalize hardened release"
          "FINAL_SHA=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tool/package-lock.json

      - name: Install dependencies
        working-directory: Tool
        run: npm ci

      - name: Run complete test suite
        id: tests
        continue-on-error: true
        working-directory: Tool
        run: npm test -- --reporter=json --outputFile=vitest-results.json

      - name: Upload Vitest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-vitest-results
          path: Tool/vitest-results.json
          if-no-files-found: error

      - name: Enforce test result
        if: steps.tests.outcome == 'failure'
        run: throw 'Vitest failed. See the hardening-vitest-results artifact.'

      - name: Build production UI
        id: build
        continue-on-error: true
        working-directory: Tool
        run: |
          & npm.cmd run build *> build.log
          $code = $LASTEXITCODE
          Get-Content build.log
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardening-build-log
          path: Tool/build.log
          if-no-files-found: error

      - name: Enforce build result
        if: steps.build.outcome == 'failure'
        run: throw 'Production build failed. See the hardening-build-log artifact.'

      - name: Check service syntax
        working-directory: Tool
        run: npm run check:service

      - name: Check installer syntax
        working-directory: Tool
        run: npm run check-installer

      - name: Check committed hardening diff
        run: |
          git fetch origin main
          git diff --check origin/main...HEAD -- Tool .github/workflows/mod-studio-verify.yml

      - name: Smoke-test production localhost service
        working-directory: Tool
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP 'studio-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'studio-stderr.log'
          $process = Start-Process -FilePath node -ArgumentList @('server/index.js') -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $deadline = (Get-Date).AddSeconds(20)
            do {
              Start-Sleep -Milliseconds 100
              $line = if (Test-Path $stdout) { Get-Content $stdout | Select-Object -First 1 } else { $null }
            } while (-not $line -and (Get-Date) -lt $deadline)
            if (-not $line) {
              $details = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
              throw "Studio did not report a startup URL. $details"
            }
            $info = $line | ConvertFrom-Json
            $response = Invoke-WebRequest -Uri $info.url -UseBasicParsing
            if ($response.StatusCode -ne 200) { throw "Studio returned HTTP $($response.StatusCode)." }
            if ($response.Content -notmatch '<div id="root"></div>') { throw 'Production page did not contain the React root.' }
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Fast-forward branch and main
        run: |
          git fetch origin main
          git merge-base --is-ancestor origin/main HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Remote main changed and is not an ancestor of the verified commit.' }
          git push origin HEAD:fix/release-hardening
          git push origin HEAD:main
          Write-Host "Published verified commit $env:FINAL_SHA"
