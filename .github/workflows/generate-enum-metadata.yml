name: Generate enum description metadata

on:
  pull_request:
    branches:
      - main
    paths:
      - 'Tool/scripts/sync-enum-metadata.mjs'
      - '.github/workflows/generate-enum-metadata.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: fix/restore-enum-descriptions
          fetch-depth: 0

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate metadata
        working-directory: Tool
        run: node scripts/sync-enum-metadata.mjs

      - name: Commit generated metadata
        run: |
          if [ -z "$(git status --porcelain -- Tool/src/enum-metadata.generated.js)" ]; then
            echo 'Generated metadata is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Tool/src/enum-metadata.generated.js
          git commit -m 'build: refresh enum description metadata'
          git push origin HEAD:fix/restore-enum-descriptions
