name: Launcher module diagnostics

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/inventory-launchers.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/consolidate-launchers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Tool/package-lock.json
      - name: Install dependencies
        working-directory: Tool
        run: npm ci
      - name: Capture module checks and focused Vitest output
        id: diagnose
        continue-on-error: true
        working-directory: Tool
        shell: pwsh
        run: |
          $failed = $false
          $files = @(
            'server/auto-detect-package.test.js',
            'server/manual-package-preflight.test.js',
            'pokerogue-mod-target-preflight.mjs',
            'server/target-discovery.js',
            'server/target-verifier.js',
            'installer-core.cjs',
            'pokerogue-mod-package-installer.cjs'
          )
          foreach ($file in $files) {
            "=== node --check $file ===" | Tee-Object -FilePath module-diagnostics.log -Append
            & node.exe --check $file *>&1 | Tee-Object -FilePath module-diagnostics.log -Append
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          '=== focused Vitest ===' | Tee-Object -FilePath module-diagnostics.log -Append
          & npx.cmd vitest run server/auto-detect-package.test.js server/manual-package-preflight.test.js --reporter=verbose *>&1 | Tee-Object -FilePath module-diagnostics.log -Append
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launcher-module-diagnostics
          path: Tool/module-diagnostics.log
          if-no-files-found: error
      - name: Enforce diagnostic result
        if: steps.diagnose.outcome == 'failure'
        shell: pwsh
        run: throw 'Module diagnostics failed. See launcher-module-diagnostics.'
